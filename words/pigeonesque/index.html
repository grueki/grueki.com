        <script>siteWrapper(
            `
            <div class="prose-wrapper">

                    <a href="/words" class="back-button"><< back</a>
                    <h1 class="prose-title">pigeonesque</h1>
                </div>
            
                <p>Have you ever seen a pigeon nest? It’s a very futile sort of thing. They’re barely cohesive, flimsy, more a pile or collection of sorts than anything that could be called a home. The pigeon hops back and forth, one oversized twig at a time. The wind blows it apart. Square one. They keep building. They will be immortalised in the derision of instagram reels and tiktok comments for months to come, if they’re lucky. Not that they’ll ever know.</p>

                <p>I enjoy this sort of back-and-forth, this peekaboo where I’m fashioning my own sort of flimsy cage out of debris and polystyrene and plant matter and whatever I find lying around. The thrill of the game is always building it back up again. The rapture of the smooth click, a lock quietly popping open, a door gently swinging ajar – it’s not so easily achieved frolicking in a wide open meadow.</p>

                <p>A show I was watching the other day talked about hope. Become hopeless, it said, and that’s where you find true peace. Hope is the enemy of satisfaction. To hope is to wish something was different, to dote earnestly in this state of "before", and therein is the poison; you cannot be fulfilled if you are in want of more. But how good is wanting more and getting it? How good is filling your life with trivial tasks, arbitrary goals and checking them off your little list? How good is it to wash the scummy dishes, rescrew and shelve the bottles, wash away the puffy eyes with cold tap water, skip the gym to clear the broken glass the morning after?</p>

                <p>I’m pathetic. It’s an unconvincing cage, and I know onlookers would stare and titter. I find myself thinking of those cages in the cartoons, comically large with bars so wide apart that the characters could slip and fall through them if they weren’t careful. My cage is barely cohesive, flimsy. Pigeonesque.</p>

                <p>I don’t sleep until very late these days. I’ve always been a bad sleeper, and not in any real way that deserves merit – I haven’t earned my suffering like those poor insomniacs who lie awake for hours, staring at the ceiling and counting their heartbeats deep into the night. No, I don’t grow in the garden of that blameless variety. I stay awake <i>hoping</i>. For what, I’m not sure. Anything other than that sleep that ticks the counter forward, hurtling me towards whatever’s next. Please, just please let me stay one more hour, one more night, let me just rest here alone until I’m right again. Until everything’s right. I can fix it. I’ll figure out what it is along the way, I think feebly, the Netflix hum rocking me into a dreamless sleep.</p>

                <p>In a stunning turn of events, I’ve found I like the man I am around others much more than the man who sits with me when I’m alone, which in full earnest I chalk up as a victory. That’s one more man than I used to like, I guess.</p>

                <p>But I honestly always thought it would develop the other way around. I grew up so scared of people, so desperate not to be perceived. There are only 60 seconds in a minute, and 60 minutes in an hour, and in an hour you can go home, breathe. Big tasks are easier when you break them down. So you better start counting. I now no longer recognise this force that comes to me in times of solitude, though it inhabits my body. I am the china shop and the shattering plates, not the manic bull that jerks about the store.</p>

                <p>All this to say, I don’t think I hate myself anymore. I can’t possibly. Because I remember what it was like to truly despise myself, and it's beginning to feel like a distant memory. When you’re in that pit, you relish your time spent in pain, writhing and turning over and over to coat yourself fully in the acid, ensuring it's saturating every crevice. I’m here because I deserve it. I will die for my sins.</p>

                <p>Dear reader, I’m curious to know. How would you define the word <i>home</i>? To me, a glimpse at its meaning shines through the usage of the phrase <i>feeling at home</i>, which is the vector I most often meet with the word these days. I’ve moved to a new city recently, and I’ve found the circle of people around me has somehow quietly filled itself up with others who do not have roots here. This idea of <i>feeling at home</i> bubbles up as a recurring theme, an unspoken undercurrent that pins the foundations of our connection.</p>

                <p>(I can’t think too much about if we’d still be friends or not without this shared sense of homelessness, if the laurels of my friendships maintain a precarious balance only for this common thread. It would be a silly exercise. What use is that? I have who I have now and I love them all and I’m grateful for them.)</p>

                <p>Some of these friends report feeling like they don't <i>feel at home</i> here yet. “I’m coming up on two years now,” admitted one, “and I’m still waiting for the holiday to end. But there’s nothing for me to go back to”. Not enough friends, not enough intimacy. Not enough stability.</p>

                <p>Thus I’ve found the glowing <i>home</i> sitting at the intersection of these little rays of perspective is this: <i>Home</i> is a place you belong. When you’re at <i>home</i>, you’re right where you’re supposed to be, and your environment supports who you are.</p>

                <p>You may notice this definition doesn't conflict with that of a pit of acid any more than it does a mother's breast, or an up-and-coming picket-lined townhouse development in one of the good suburbs.</p>

                <p>I can see why it would be easy to conflate my condition with the garish pop-psych Stockholm Syndrome diagnosis, and I resent that a little. It's important to me to think of myself as special, or at the very least not so easily categorised, so I know I matter. Bestie, my suffering is so unique and goated and not like the other girls'. It's all a show. I can leave whenever I want. The trick is, the cage is always unlocked, actually. But it's a bit embarrassing when I look up and realise there's no one in the audience but me. So I might as well hop in and keep dancing.</p>

                <p>See, the difference is, I don't miss hating myself at all. I feel no loyalty or affinity to my cage, or my pit, or whatever other very clever aphorism I've chosen to represent some facet of the fact that I dabble in destroying myself, small chunks at a time. I think of the deal like so: by losing the capacity to hate myself, I have lost the pit as a place I belong. I am dislocated. Homeless.</p>

                <p>And so, here's how it goes. Don't you remember what it was like? How familiar. And it will be so gratifying to pick up all the pieces afterwards. You'll really feel like you're contributing to a good cause, a bigger picture. One more rodeo, little bull, for old times' sake.</p>

                <p>I lied to you at the beginning, by the way. Sorry. I've searched it up on Wikipedia now.</p>

                <p>Pigeon nests often look weak, like they’ll fall apart at any moment. But they’re always careful to build the nests in sheltered spots, leveraging the grey urban sprawl where they can, and despite their appearance they’re actually plenty secure to foster the tiny white eggs until they hatch, pipping and chirping into the world.</p>

                <p>Besides, how else would there be so many pigeons?</p>
            </div>
            `,
            "words/words"
        );</script>
