            <div class="prose-wrapper">
                <div class="prose-header">
                    <a href="/words" class="back-button"><< back</a>
                    <h1 class="prose-title">war and peace</h1>
                </div>
                
                <div class="poetry-container">
                    <p>go! boy,</p><p>for though the war is won</p><p>the ground begets your smoking gun,</p><p>sweating eyes bear hands in wings </p><p>and brass frogs gape upwards, near prospect —</p><p>&nbsp;</p><p>go! though your soles are raw</p><p>tectonic blood mulled flat with dust</p><p>stains and thickens; that crust, too</p><p>will rupture a thousand lifetimes more —</p><p>&nbsp;</p><p>go! the sun is bright</p><p>searing rays, shards of white in which</p><p>pearlescent hyacinths quiver, blooming sighs</p><p>besides, clouds brew in peripheral sights —</p><p>&nbsp;</p><p>go, boy, into that light!</p>
                </div>
            </div>
            `,
            "words/words"
        );</script>
    </body>
