        <script>siteWrapper(
            `
            <div class="prose-wrapper">
                <div class="prose-header">
                    <a href="/words" class="back-button"> << back</a>
                    <div class="title-stack">
                        <h1 class="prose-title">moore wilsons' secret casino</h1>
                        <h3 class="prose-title">(or: how i won and lost it all in the streetz of Te Aro)</h3>
                    </div>
                </div>
            
                <p>We went to Moore Wilsons maybe two weeks ago, before I moved. I was still in Wellington.</p>

                <p>Ellie and Carl were visiting. Ellie was very excited ("Because I love Farro!" "This is better than Farro, Ellie. Trust me. Farro don't hold a candle to Moore Wilsons") and Carl could not have given less of a shit. I cannot remember for the life of me what we bought once we got there. Perhaps a craft soda, maybe an apple for Ellie. But we must have bought something, because we met the ginger cashier. </p>

                <p>Here's a step by step guide on how to enter the Moore Wilsons Secret Casino:</p>

                <ul>
                    <li>Use the middlemost checkout, OR approach the checkout with the gingermost cashier</li>
                    <li>Pass the group pre-inspection</li>
                    <li>The cashier will ask you to hold out your hand. You must accept.</li>
                </ul>

                <p>We were definitely inspected. He looked us all up and down, and as his gaze met mine I felt an uncanny tickling behind my sternum, as if my very soul was being grazed with a thin-tooth hotel comb. I couldn't say what the criteria was but we met it, apparently. I'm still unsure if this was complimentary or insulting. </p>

                <p>Carl was the first to receive his blessing. "Hold out your hand," the cashier requested, his eyes unnarrowing — softening — to reveal friendly, round waterlines. "Roll it," he commanded. In Carl's hand was a marbled blue d20. "If you get a 20, you can have it."</p> 
                
                <p>Carl spun down a 6. No dice.</p>

                <p>Time froze and God walked in. Stepping carefully around the cold stony shoppers to put a hand on my shoulder, He told me: Izzy, I got this one. You better roll that shit right now. By the time he was gone, there was a gold etched 20 sitting face-up in front of me. The cashier shrugged. "It's yours."</p>

                <p>But the house always wins in Vegas. Mum called, Dad was wondering if we could pick up his yoghurt and bread because they were all out in New World. But not at Moore Wilsons. Moore Wilsons is always in stock. New World don't hold a candle to Moore Wilsons.</p>

                <p>I knew if we went back in, we'd have to go back out through the secret casino. Our fate was written. I want to say I felt uneasy about this, but in truth the dopamine was addling my thoughts, and I was itching to see our mystery dealer again.</p>

                <p>"Hold out your hand," I told him, lowering my yoghurt onto the conveyor belt. Carl and Ellie dithered behind me. In his palm, I placed a marbled blue d20. Sphinxes can never resist the seduction of a game. His eyes twinkled as he produced a matching red die, sealing the deal. We both knew what came next. The terms of our agreement: "Winner takes all".</p>

                <p>We both rolled a 14. God sat huddled in the rafters, chuckling and slurping down Moore Wilsons kina straight from the little plastic pot. He's already seen this one, but He can never resist a rewatch. We rolled again, both 18s.</p>

                <p>The cashier's eyes flickered up at me, a faint angle playing at the corners of his mouth. What were the odds? Without warning, we were lurched into one of only 0.25% of timelines. That scared me. God dangled his knife on a string above my exposed neck, a little damp and oozing with the salty aroma of kina juice. In this timeline, I will be struck by lightning. I will bear identical twins. I will develop schizophrenia. "You should walk away, Izzy," He sniffed, dabbing his soggy fingers with a paper towel. The kina pot was empty. "Who's going to believe you when you lose?"</p>

                <p>It was my fatal flaw, my blasphemy. My stubborn disdain for being told what to do sealing my own stupid fate. "We roll again."</p>

                <p>A six and a seventeen, the seventeen etched instead in a cool silver tone against the red enamel backing. My ugly hubris. I shrugged at him. "You can't win them all, I guess". We took my dad's bread and yoghurt, and left otherwise empty handed.</p>

                <p>Ellie and Carl and I chortled and swayed all the way home, making a show of ironic beseechment and claiming injustice. Take that, God, they'll believe me. They will, they were there, they saw everything, and we guffaw so loudly that the whole encounter is larger than life, unshrinkable. </p>

                <p>But just as easily as I have forgotten the snacks we purchased once eaten, so too will we forget the colours of the dice in their absence, the numbers we rolled, then the amber sheen of the cashier's hair catching the industrial overhead lighting. And I will eventually forget how to breathe. And then only God will hold the records, and even today He is quick to torment me with the threat of flushing them down a toilet after a bad day at the office, or losing them under a pile kept unkempt for too long.</p>

                <p>I don't hold a candle to Moore Wilsons.</p>
