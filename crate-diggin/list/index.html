<!DOCTYPE html>
<html id="html-root">
    <body>
        <script type="text/javascript" src="/site-wrapper.js"></script>
        <script type="text/javascript" src="./album-grid.js"></script>
        <script>siteWrapper(
            `
            <div class="albums-list" id="albums-list">
                <div class="toolbar">
                    <a href="/crate-diggin" class="back-button"><< back</a>
                    <label for="sort" class="sort-button">sorting by</label>
                    <select name="sort" class="sort-dropdown" id="sort-dropdown">
                        <option value="title">title</option>
                        <option value="artist">artist</option>
                        <option value="year">year discovered</option>
                    </select>
                    <select name="direction" id="direction-dropdown">
                        <option value="asc">asc</option>
                        <option value="desc">desc</option>
                    </select>
                </div>
                <p>kinda fkn rude especially after that lovely css animation i slaved away on. but whatever</p>
                <div class="albums-grid" id="albums-grid"></div>
            </div>
            <div class="modal-overlay" id="modal-overlay">
                <div class="album-modal" id="album-modal">
                    <div class="album-info">
                        <img class="modal-album-img" id="modal-album-img"/>
                        <p class="modal-album-title" id="modal-album-title"></p>
                        <p id="modal-album-artist"></p>
                    </div>
                    <div class="album-comments" id="album-comments">
                        <p id="modal-album-comment"></p>
                    </div>
                </div>
            </div>
            `,
            "crate-diggin/list/list"
            );
            initDropdowns();
            albumsGrid();
        </script>
    </body>
</html>
